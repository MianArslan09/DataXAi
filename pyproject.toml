[tool.black]
line-length = 100
target-version = ["py312"]
exclude = '''/(\.venv|migrations|staticfiles)/'''

[tool.isort]
profile = "black"
line_length = 100
skip = [".venv", "migrations"]
src_paths = ["apps", "config"]

[tool.ruff]
line-length = 100
exclude = [".venv", "migrations", "staticfiles"]

[tool.ruff.lint]
select = ["E", "F", "B"]
