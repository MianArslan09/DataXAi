name: Frontend CI

on:
  push:
    branches:
      - main
      - feature/dataxai-frontend
    paths:
      - frontend/**
      - .github/workflows/frontend-ci.yml

  pull_request:
    branches:
      - main
    paths:
      - frontend/**
      - .github/workflows/frontend-ci.yml

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: TypeScript, browser regression, and Stage 5 evidence
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: frontend

    env:
      CI: "true"
      LIVE_DJANGO: "0"
      CAPTURE_FIGURES: "0"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Playwright Chromium and OS libraries
        run: npx playwright install --with-deps chromium

      - name: TypeScript check
        run: npm run typecheck

      - name: Prettier check
        run: npm run format:check

      - name: Production build
        run: npm run build

      - name: Frontend regression suite (demo and mocked API)
        run: npm test

      - name: Capture and verify Stage 5 thesis evidence
        run: |
          run_id="stage5-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          export STAGE5_RUN_ID="${run_id}"
          echo "STAGE5_RUN_ID=${run_id}" >> "${GITHUB_ENV}"

          CAPTURE_COVERAGE_FIGURES=1 npm run stage5:capture -- "${run_id}"
          npm run stage5:verify-raw -- "${run_id}"
          npm run stage5:compose -- "${run_id}"
          npm run stage5:verify -- "${run_id}"

      - name: Upload generated Stage 5 evidence for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage5-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: frontend/docs/figures/stage5/stage5-ci-*
          if-no-files-found: ignore
          retention-days: 14
